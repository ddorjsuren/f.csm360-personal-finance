<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Хувийн санхүү бүртгэл</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body id="index" class="roboto-regular">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm p-4 rounded-4">
                    <div class="card-body">
                        <h1><i class="fa-solid fa-piggy-bank"></i>Хувийн санхүү бүртгэл</h1>
                        <p class="text-muted text-center small mb-4">Нэвтрэх эсвэл шинээр бүртгүүлэх</p>
                        <form id="auth-form">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">И-мэйл хаяг</label>
                                <input class="form-control form-control-lg" id="email" type="email" required placeholder="И-мэйл хаяг">
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-semibold">Нууц үг</label>
                                <input class="form-control form-control-lg" id="password" type="password" required placeholder="*************">
                            </div>
                            <div class = "d-grid gap-2">
                                <button class="btn btn-success btn-lg fw-semibold" id="submit" type="submit">Нэвтрэх</button>
                                <button class="btn btn-outline-secondary" id="btn-register" type="button">Бүртгүүлэх</button>
                            </div>
                        </form>
                        <div id="message" class="text-danger text-center small mt-3 fw-medium"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
   
    <script type="module" src="js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/c6c1d849f8.js" crossorigin="anonymous"></script>
  </body>
</html>
